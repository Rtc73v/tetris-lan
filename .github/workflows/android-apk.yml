name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build log
        if: failure()
        run: |
          echo "## Build Log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build.log

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.2
          name: Tetris LAN v1.8.2
          body: |
            **自动构建版本**
            - 新增对手迷你棋盘实时同步显示
            - 修复多人模式准备/取消BUG
            - Bot数量放开至房间人数上限
            - 房主外至少1人/Bot即可开局
            - Bot无需准备，自动参战
            - 重连上一局时检测房间是否在线
            - 房主断线后按加入顺序自动选举新房主
            - 房间名随机生成，不与玩家绑定
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
