name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache keystore
        uses: actions/cache@v4
        id: cache-keystore
        with:
          path: ~/.android/tetris.keystore
          key: tetris-keystore-v2

      - name: Generate keystore
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/tetris.keystore -alias tetris \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ECHO, OU=Tetris, O=LAN, L=Local, ST=State, C=CN"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build log
        if: failure()
        run: |
          echo "## Build Log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tetris-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
