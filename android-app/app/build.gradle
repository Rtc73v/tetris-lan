plugins { id 'com.android.application' }

android {
    namespace 'com.echo.tetrislan'
    compileSdk 35
    signingConfigs {
        fixed {
            storeFile file('tetris.keystore')
            storePassword 'android'
            keyAlias 'tetris'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.echo.tetrislan'
        minSdk 23
        targetSdk 35
        versionCode 23
        versionName '1.9.0'
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }
}
